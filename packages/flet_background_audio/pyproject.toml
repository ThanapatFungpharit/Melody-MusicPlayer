[project]
name = "flet-background-audio"
version = "0.2.0"
description = "Melody's Flet bridge for background playback and system media controls"
requires-python = ">=3.10"
dependencies = [
    "flet==0.86.5",
]

[tool.setuptools.package-data]
"flutter.flet_background_audio" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
