name: Application builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    environment: production
    runs-on: windows-latest
    env:
      MELODY_ENV: production
      MELODY_DEBUG: "0"
      FLET_DEBUG: "0"
      PYTHONDEVMODE: "0"
      PYTHONASYNCIODEBUG: "0"
      PYTHONOPTIMIZE: "2"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install isolated release toolchain
        run: uv sync --frozen --no-dev --group build
      - name: Build desktop bundle
        shell: bash
        run: >-
          uv run --frozen --no-dev --group build python tools/build_desktop.py
          windows
          --architecture x86_64
          -- --yes
      - name: Verify production artifact
        run: >-
          uv run --frozen --no-dev --group build python
          tools/verify_production_artifact.py
          build/windows
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: melody-windows-x86_64
          path: build/windows
          if-no-files-found: error

  linux:
    environment: production
    runs-on: ubuntu-latest
    env:
      MELODY_ENV: production
      MELODY_DEBUG: "0"
      FLET_DEBUG: "0"
      PYTHONDEVMODE: "0"
      PYTHONASYNCIODEBUG: "0"
      PYTHONOPTIMIZE: "2"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install isolated release toolchain
        run: uv sync --frozen --no-dev --group build
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Build desktop bundle
        shell: bash
        run: >-
          uv run --frozen --no-dev --group build python tools/build_desktop.py
          linux
          --architecture x86_64
          -- --yes
      - name: Verify production artifact
        run: >-
          uv run --frozen --no-dev --group build python
          tools/verify_production_artifact.py
          build/linux
      - name: Archive Linux bundle with executable permissions
        run: tar -czf build/melody-linux-x86_64.tar.gz -C build/linux .
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: melody-linux-x86_64
          path: build/melody-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    environment: production
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    env:
      MELODY_ENV: production
      MELODY_DEBUG: "0"
      FLET_DEBUG: "0"
      PYTHONDEVMODE: "0"
      PYTHONASYNCIODEBUG: "0"
      PYTHONOPTIMIZE: "2"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.architecture }}
      - name: Install isolated release toolchain
        run: uv sync --frozen --no-dev --group build
      - name: Build desktop bundle
        shell: bash
        run: >-
          uv run --frozen --no-dev --group build python tools/build_desktop.py
          macos
          --architecture ${{ matrix.architecture }}
          -- --yes
      - name: Verify production artifact
        run: >-
          uv run --frozen --no-dev --group build python
          tools/verify_production_artifact.py
          build/macos
      - name: Archive macOS bundle with permissions and symlinks
        run: tar -czf build/melody-macos-${{ matrix.architecture }}.tar.gz -C build/macos .
      - name: Upload desktop bundle
        uses: actions/upload-artifact@v7
        with:
          name: melody-macos-${{ matrix.architecture }}
          path: build/melody-macos-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error

  android:
    environment: production
    runs-on: ubuntu-latest
    env:
      MELODY_ENV: production
      MELODY_DEBUG: "0"
      FLET_DEBUG: "0"
      PYTHONDEVMODE: "0"
      PYTHONASYNCIODEBUG: "0"
      PYTHONOPTIMIZE: "2"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install isolated release toolchain
        run: uv sync --frozen --no-dev --group build
      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEY_STORE_BASE64: ${{ secrets.ANDROID_KEY_STORE_BASE64 }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          for name in ANDROID_KEY_STORE_BASE64 ANDROID_KEY_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "Missing required production secret: ${name}" >&2
              exit 1
            fi
          done
          key_store="$RUNNER_TEMP/melody-upload.jks"
          printf '%s' "$ANDROID_KEY_STORE_BASE64" | base64 --decode --ignore-garbage > "$key_store"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$key_store" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$ANDROID_KEY_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "FLET_ANDROID_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Build Android APK
        run: >-
          uv run --frozen --no-dev --group build python -m tools.build_android apk
          -- --yes --split-per-abi
      - name: Build Android App Bundle
        run: >-
          uv run --frozen --no-dev --group build python -m tools.build_android aab
          -- --yes
      - name: Verify production artifacts
        run: >-
          uv run --frozen --no-dev --group build python
          tools/verify_production_artifact.py
          build/apk build/aab
      - name: Upload Android arm64-v8a APK
        uses: actions/upload-artifact@v7
        with:
          name: melody-android-arm64-v8a
          path: build/apk/melody-arm64-v8a.apk
          if-no-files-found: error
      - name: Upload Android armeabi-v7a APK
        uses: actions/upload-artifact@v7
        with:
          name: melody-android-armeabi-v7a
          path: build/apk/melody-armeabi-v7a.apk
          if-no-files-found: error
      - name: Upload Android x86_64 APK
        uses: actions/upload-artifact@v7
        with:
          name: melody-android-x86_64
          path: build/apk/melody-x86_64.apk
          if-no-files-found: error
      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: melody-android-aab
          path: build/aab/melody.aab
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [windows, linux, macos, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Archive artifacts for release
        run: |
          cd artifacts
          for dir in */; do
            if [ -d "$dir" ]; then
              if [[ "$dir" == melody-linux-*/ || "$dir" == melody-macos-*/ ]]; then
                cp "$dir"*.tar.gz .
              else
                zip -r "${dir%/}.zip" "$dir"
              fi
            fi
          done
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
