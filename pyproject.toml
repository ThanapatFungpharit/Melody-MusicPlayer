[project]
name = "musicplayer"
version = "0.1.0"
description = "A cross-platform local music player application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.86.5",
    "flet-audio>=0.86.5",
    "flet-background-audio>=0.1.0",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
musicplayer = "musicplayer.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicplayer = ["bin/*/*/*"]

[tool.flet]
product = "Melody"
artifact = "melody"

[tool.flet.compile]
app = true
packages = true

[tool.flet.cleanup]
app = true
packages = true
app_files = [
    "**/__main__.pyc",
    "**.map",
    "**/*.map",
    "**.pyi",
    "**/*.pyi",
]
package_files = [
    "**/test",
    "**/tests",
    "**/testing",
    "**/pytest_plugin.py",
    "**/pytest_plugin.pyc",
    "**/test_*.py",
    "**/test_*.pyc",
    "**.map",
    "**/*.map",
]

[tool.flet.flutter]
build_args = ["--release"]

[tool.flet.app]
path = "src"
module = "main"
exclude = [
    ".flet",
    "__pycache__",
    "musicplayer/__main__.py",
    'musicplayer\__main__.py',
]

[tool.flet.android]
legacy_packaging = true
min_sdk_version = 29
target_arch = ["arm64-v8a", "x86_64"]

[tool.flet.android.permission]
"android.permission.FOREGROUND_SERVICE" = true
"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" = true
"android.permission.WAKE_LOCK" = true

[tool.flet.ios.info]
UIBackgroundModes = ["audio"]

[tool.flet.dev_packages]
flet-background-audio = "packages/flet_background_audio"

[tool.uv.sources]
flet-background-audio = { path = "packages/flet_background_audio", editable = true }

[dependency-groups]
build = [
    "flet-cli==0.86.5",
]
dev = [
    "flet-desktop>=0.86.5",
    "ruff>=0.16.3",
    "ty>=0.0.78",
]
